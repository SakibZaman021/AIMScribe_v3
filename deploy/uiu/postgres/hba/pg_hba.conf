# Who may connect to the AIMScribe database server, and how.
#
# Mounted read-only at /etc/postgresql/hba/ (hba_file in the profile),
# so it is the same on every server and changed only through the repository.
# The data folder's own pg_hba.conf is no longer read. A folder, not one
# file, so an edit is seen; migrate.sh reloads it on every update.
#
# TYPE  DATABASE     USER  ADDRESS        METHOD
# Inside the container: the init scripts, migrate.sh and health checks.
local   all          all                  trust
host    all          all   127.0.0.1/32   trust
host    all          all   ::1/128        trust
local   replication  all                  trust
host    replication  all   127.0.0.1/32   trust
host    replication  all   ::1/128        trust
# The backup job's base backup, from the internal Docker network only, with
# the superuser's password. Only a role with REPLICATION can use it.
host    replication  all   samenet        scram-sha-256
# Everything else - the API through PgBouncer, the workers, the monitor -
# with a password, as before.
host    all          all   all            scram-sha-256
