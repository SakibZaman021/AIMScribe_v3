# ================================================================
# PostgreSQL 16 on the DigitalOcean droplet (s-8vcpu-16gb)
#
# 8 vCPU, 16 GB, one 320 GB SSD. The default postgresql.conf beside
# this file is for the 64 GB UIU machine: its shared_buffers alone is
# 16 GB, the whole droplet, and the database is killed for memory as
# its cache fills. Choose this profile in .env:
#
#     AIMS_PG_CONF=./postgres/postgresql.16gb.conf
#     AIMS_PG_MEMORY=6g
#     AIMS_ARCHIVE_MEMORY=2g
#     AIMS_WORK_TMPFS=3g
#     AIMS_DISK_FLOOR_GB=40
#
# How the 16 GB is shared - container ceilings, not reservations:
#
#     postgres        6g    shared_buffers 4GB + connections + sorts
#     api             2g
#     archive-worker  2g    joins one consultation in its tmpfs
#     transcribe      1g    (only if transcription is on)
#     backup          512m
#     redis, gateway, monitor, pgbouncer   ~900m together
#                    ----
#                    ~12.4g, leaving ~3.6g for the OS and its file cache
#
# Only the memory and parallelism lines differ from postgresql.conf.
# Every durability setting is the same, line for line.
# ================================================================

listen_addresses = '*'          # only the internal Docker network reaches it
port = 5432
max_connections = 100           # PgBouncer fronts this; the API never needs many

# ---- memory: inside AIMS_PG_MEMORY=6g ----
shared_buffers = 4GB            # a quarter of the droplet
effective_cache_size = 10GB     # shared_buffers plus what the OS caches
work_mem = 16MB
maintenance_work_mem = 512MB

# ---- durability: never trade this for speed ----
# A recording's hash chain exists to prove nothing was changed. A database
# that loses the last few seconds of writes in a power cut would break that
# proof quietly, so nothing here is relaxed: fsync on, full page writes on,
# synchronous commit on. The power-loss-protected NVMe is what makes this
# fast enough (SRS-SRV-02).
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
wal_compression = on
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
# Data checksums cannot be set here: they are chosen when the database is
# first created, by POSTGRES_INITDB_ARGS in the compose file.

# Keep a little WAL for point-in-time recovery between nightly dumps.
archive_mode = off              # turn on with the archive_command below when
# archive_command = 'test ! -f /backups/wal/%f && cp %p /backups/wal/%f'
                                # a WAL archive is wanted (SRS-DAT-16)

# ---- planner, for NVMe ----
random_page_cost = 1.1
effective_io_concurrency = 200

# ---- parallelism ----
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ---- autovacuum: the tables that grow every day ----
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# ---- what the log has to answer ----
# When a recorder says a piece was refused, the question is always "what did
# the database do, and when". Statements themselves are not logged: they
# carry patient identifiers.
log_destination = 'stderr'
logging_collector = off         # Docker collects it
log_line_prefix = '%m [%p] %u@%d '
log_min_duration_statement = 1000   # anything slower than a second
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 10000
log_statement = 'ddl'           # schema changes, never data

# ---- timeouts ----
statement_timeout = 30s         # the API's own requests are short
idle_in_transaction_session_timeout = 60s
lock_timeout = 10s

# ---- time ----
timezone = 'UTC'                # every stored time is UTC; the clinic's
                                # local clock is computed for names only
datestyle = 'iso, mdy'

# ---- security ----
password_encryption = scram-sha-256
ssl = off                       # one machine, one private Docker network;
                                # nothing crosses a wire to reach this
