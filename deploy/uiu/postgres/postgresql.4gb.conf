# ================================================================
# PostgreSQL 16 on a small AIMS LAB server (SRS 3.3 §10.3)
#
# For a machine where AIMScribe has about 4 GB of memory in total -
# the 8 core / 8 GB server CITS offered, with Windows taking half.
#
# `postgresql.conf` beside this file is for the recommended machine
# (16 cores, 64 GB). Starting that one here would fail outright:
# shared_buffers = 16GB cannot be allocated out of 4.
#
# Choose it in .env:
#
#     AIMS_PG_CONF=./postgres/postgresql.4gb.conf
#
# What it gives up: caching. Postgres will read from disk more often,
# which on NVMe costs tenths of a millisecond. What it does not give
# up is a single promise about durability - every setting below the
# line is identical to the large machine's.
# ================================================================

listen_addresses = '*'          # only the internal Docker network reaches it
port = 5432

# ---- memory -----------------------------------------------------
# The whole database container is capped at 1 GB. shared_buffers is a
# quarter of that; the rest is left for connections, sorts and the
# operating system's own cache of the data files.
max_connections = 60            # PgBouncer fronts this; the API needs few
shared_buffers = 256MB
effective_cache_size = 1GB      # what the OS is likely caching for us
work_mem = 8MB                  # per sort; 60 connections x a few sorts
maintenance_work_mem = 128MB    # index builds, vacuum
huge_pages = off

# ---- writing, and telling the truth about it --------------------
# Unchanged from the large machine. A recording's chain is only worth
# something if what the database reports as written really is written.
wal_level = replica

# Continuous archiving, for recovery to any minute (SRS-DAT-16). Each WAL
# segment is compressed into /wal as it fills - or after archive_timeout,
# however quiet the clinics are - and the backup job encrypts it and sends it
# off the server. With the nightly base backup, a database can be rebuilt as
# it was at any moment of the last weeks, losing at most archive_timeout.
# The .part name and the rename mean a half-written segment is never shipped;
# writing it again after a crash gives the same file.
archive_mode = on
archive_command = 'gzip -1 < %p > /wal/%f.gz.part && mv -f /wal/%f.gz.part /wal/%f.gz'
archive_timeout = 300
# Who may connect, versioned here instead of edited inside the data folder:
# the backup job's base backup needs a replication connection from the
# internal network (hba/pg_hba.conf beside this file).
hba_file = '/etc/postgresql/hba/pg_hba.conf'

synchronous_commit = on
fsync = on
full_page_writes = on
wal_compression = on
max_wal_size = 2GB              # smaller than the big machine's; more
min_wal_size = 256MB            # frequent checkpoints, less disk held
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# ---- planner, for a small machine on NVMe -----------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ---- parallelism ------------------------------------------------
# Eight cores, shared with the server and the archive worker. Two
# parallel workers, so a report can never take the machine.
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# ---- autovacuum: keep up, quietly -------------------------------
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 5ms

# ---- what it says when something is wrong -----------------------
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000   # anything over a second, with its text
log_checkpoints = on
log_connections = off
log_lock_waits = on
log_temp_files = 8MB
log_line_prefix = '%m [%p] %u@%d '

# ---- timing -----------------------------------------------------
timezone = 'UTC'                # the clinic's own zone is applied above this
datestyle = 'iso, mdy'
lc_messages = 'C'

# ---- safety -----------------------------------------------------
statement_timeout = 60s             # no query outlives a consultation
idle_in_transaction_session_timeout = 60s
lock_timeout = 10s
