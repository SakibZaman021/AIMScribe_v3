; ================================================================
; PgBouncer for AIMScribe (SRS 3.3 §10.3)
;
; The API opens and closes connections all day; PostgreSQL is expensive to
; connect to and cheap to query. PgBouncer keeps a small set of real
; connections and lends them out per transaction.
;
; **Transaction mode has one trap**, and it is the reason this file is
; commented at all: a driver that prepares a statement on one connection
; may be handed another for the next statement, and the prepared statement
; is not there. asyncpg does this by default. The application turns its
; statement cache off when AIMS_DB_POOLER=transaction, which the compose
; file sets for every service that comes through here. If that variable is
; ever dropped, the symptom is "prepared statement does not exist" under
; load and nowhere else.
; ================================================================

[databases]
aims_recordings = host=DB_HOST_PLACEHOLDER port=DB_PORT_PLACEHOLDER dbname=aims_recordings
aims_clinical   = host=DB_HOST_PLACEHOLDER port=DB_PORT_PLACEHOLDER dbname=aims_clinical

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /var/run/pgbouncer

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Only the roles in userlist.txt exist here, and each one reaches only its
; own database (SRS-DBA-20).
pool_mode = POOL_MODE_PLACEHOLDER
max_client_conn = MAX_CLIENT_CONN_PLACEHOLDER
default_pool_size = DEFAULT_POOL_SIZE_PLACEHOLDER
min_pool_size = 4
reserve_pool_size = 5
reserve_pool_timeout = 3

server_reset_query = DISCARD ALL
server_check_query = select 1
server_check_delay = 30
server_lifetime = 3600
server_idle_timeout = 600

; A query that has not finished in half a minute is not going to help the
; recorder that is waiting for it; the API gives up at the same point.
query_timeout = 35
query_wait_timeout = 20
client_idle_timeout = 0

ignore_startup_parameters = extra_float_digits,options

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 300

admin_users = aims_recordings
stats_users = aims_monitor
