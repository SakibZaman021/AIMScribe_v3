[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts = -q --strict-markers
filterwarnings =
    # audioop is deprecated in 3.11 and gone in 3.13. simple_splitter falls back to
    # a pure-Python RMS when the import fails, so this is expected and handled.
    ignore:'audioop' is deprecated:DeprecationWarning
